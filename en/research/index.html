:root{--accent:#4AC67F;--accent-dk:#36a866;--ink:#0A0A0A;--sub:#444;--mid:#777;
--line:#E8E8E4;--bg:#F6F6F3;--white:#fff;--maxw:760px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Inter','Helvetica Neue',system-ui,sans-serif;color:var(--ink);
background:var(--white);margin:0;line-height:1.65;font-size:18px;
-webkit-font-smoothing:antialiased}
a{color:var(--accent-dk);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
.wrap.tm-wrap{max-width:1180px;padding:0 24px}
.bcrumb{font-size:12.5px;color:var(--mid);margin:18px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bcrumb a{color:var(--mid);text-decoration:none}
.bcrumb a:hover{color:var(--accent-dk);text-decoration:underline}
.bcrumb .sep{color:var(--line)}
.bcrumb .cur{color:var(--ink);font-weight:600}
/* Header */
.site-hdr{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);
backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.site-hdr .bar{max-width:1080px;margin:0 auto;padding:0 22px;height:60px;display:flex;
align-items:center;justify-content:space-between}
.site-hdr img{height:24px;display:block}
.site-hdr nav{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:500}
.site-hdr nav a{color:var(--sub)}
.site-hdr nav a:hover{color:var(--ink);text-decoration:none}
.site-hdr nav a.cta{color:var(--accent-dk);font-weight:600}
@media(max-width:560px){.site-hdr nav a.hide-sm{display:none}}
/* Article */
main{padding:40px 0 8px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
color:var(--accent-dk);margin:0 0 10px}
article>.eyebrow{margin-top:18px}
h1{font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
.lead{font-size:20px;line-height:1.55;color:var(--sub);margin:0 0 18px;font-weight:400}
.pubdate{font-size:14px;color:var(--mid);margin:0 0 30px}
article h2{font-size:25px;line-height:1.25;font-weight:800;letter-spacing:-.01em;
margin:42px 0 4px;padding-top:22px;border-top:2px solid var(--line);scroll-margin-top:74px}
article h3{font-size:20px;line-height:1.3;font-weight:700;margin:28px 0 8px;scroll-margin-top:74px}
article h4{font-size:20px;line-height:1.3;font-weight:700;margin:28px 0 8px;scroll-margin-top:74px}
article h3.art-sub{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
color:var(--mid);margin:34px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px;
scroll-margin-top:74px}
article p{margin:0 0 16px}
article hr{border:none;border-top:1px solid var(--line);margin:30px 0}
/* Sommaire de l'article (TOC ancré) — liens clairement cliquables, libellés courts */
.toc{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin:26px 0}
.toc-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid);margin:0 0 14px}
.toc-grp{margin:0 0 16px}.toc-grp:last-child{margin-bottom:0}
.toc-g{display:block;font-size:13px;font-weight:800;color:var(--ink);margin:0 0 8px;letter-spacing:-.01em}
.toc-g a{color:inherit;text-decoration:none}
.toc-g a:hover{color:var(--accent-dk)}
.toc li.toc-all a{font-weight:800}
.toc ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 26px}
.toc li{margin:0;min-width:0}
.toc li a{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600;color:var(--accent-dk);line-height:1.4;padding:4px 8px;margin:0 -8px;border-radius:7px;text-decoration:none;transition:background .12s}
.toc li a::before{content:"→";flex:none;color:var(--accent);font-weight:800;font-size:13px}
.toc li a:hover{background:var(--white);text-decoration:none}
.toc li a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.toc ul{grid-template-columns:1fr}}
/* Bloc prospective « le coup d'après » (hypothèses, jamais un fait) */
.prospective{margin:34px 0;padding:20px 24px;border:1px dashed var(--accent);border-radius:14px;background:var(--bg)}
.pros-t{font-size:16px;font-weight:800;color:var(--ink);margin:0 0 4px;letter-spacing:-.01em}
.pros-disc{font-size:12.5px;color:var(--mid);font-style:italic;margin:0 0 14px}
.pros-item{margin:0 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.pros-item:first-of-type{border-top:none;padding-top:0}
.pros-h{font-size:13.5px;font-weight:700;color:var(--sub);margin:0 0 6px;line-height:1.4}
.prospective ul{list-style:none;margin:0;padding:0}
.prospective li{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 6px;padding-left:20px;position:relative}
.prospective li::before{content:"→";position:absolute;left:0;color:var(--accent-dk);font-weight:800}
.prospective li strong{color:var(--accent-dk)}
/* Variante INLINE : « le coup d'après » SOUS chaque opération (prolonge l'analyse, style distinct) */
.pros-inline{margin:14px 0 30px;padding:14px 18px;border:1px dashed var(--accent);border-radius:12px;background:var(--bg)}
.pros-il{font-size:13px;font-weight:800;color:var(--accent-dk);margin:0 0 8px;letter-spacing:-.01em}
.pros-il span{font-weight:500;color:var(--mid);font-style:italic}
.pros-inline ul{list-style:none;margin:0;padding:0}
.pros-inline li{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 9px;padding-left:20px;position:relative;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.pros-inline li::before{content:"→";position:absolute;left:0;top:0;color:var(--accent-dk);font-weight:800}
.pros-inline li strong{color:var(--accent-dk)}
.pros-t{flex:1 1 auto;min-width:0}
.pros-w{color:var(--mid);font-weight:400}
.pros-inline li .op-eval,.pros-row .op-eval{flex:0 0 auto;margin-top:0;font-size:11px;font-weight:700;padding:3px 10px;background:var(--ink);border-color:var(--ink);color:#fff}
.pros-inline li .op-eval-panel,.pros-row .op-eval-panel{flex:1 1 100%;margin-top:6px}
/* Visuel de section dans l'article (carte / heatmap du type, illustration) */
.art-secviz{display:block;margin:16px 0 24px;border:1px solid var(--line);border-radius:14px;overflow:hidden;
line-height:0;transition:border-color .15s,transform .15s}
.art-secviz:hover{border-color:var(--accent);transform:translateY(-1px)}
.art-secviz img{width:100%;height:auto;display:block;cursor:zoom-in}
.art-viz2{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0 22px;align-items:center}
.art-viz2 .art-secviz{flex:1 1 320px;margin:0}
/* CTA newsletter */
.cta-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;
padding:24px 26px;margin:34px 0}
.cta-box h3{margin:0 0 6px;font-size:19px;font-weight:700;border:none;padding:0}
.cta-box p{margin:0 0 16px;color:var(--sub);font-size:15px}
.btn{display:inline-block;background:var(--accent);color:#06281a;font-weight:700;
font-size:15px;padding:12px 22px;border-radius:10px;text-decoration:none}
.btn:hover{background:var(--accent-dk);color:#fff;text-decoration:none}
/* Index archive */
.idx-hero{padding:46px 0 8px}
.idx-list{list-style:none;padding:0;margin:24px 0 0}
.idx-list li{border-top:1px solid var(--line);padding:22px 0}
.idx-list a.card{display:block;color:inherit}
.idx-list a.card:hover{text-decoration:none}
.idx-list .d{font-size:13px;color:var(--mid);font-weight:500}
.idx-list .t{font-size:21px;font-weight:700;line-height:1.3;margin:4px 0 6px;
letter-spacing:-.01em}
.idx-list a.card:hover .t{color:var(--accent-dk)}
.idx-list .x{color:var(--sub);font-size:15px;margin:0}
/* Nav inter-articles */
.pager{display:flex;justify-content:space-between;gap:14px;margin:30px 0 0;
font-size:14px;font-weight:600}
.pager a{flex:1}
.pager .next{text-align:right}
.back{display:inline-block;margin:24px 0 0;font-size:14px;font-weight:600}
/* Footer */
.site-ft{border-top:1px solid var(--line);margin-top:46px;padding:26px 0 40px}
.site-ft .bar{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;
flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;
font-size:13px;color:var(--mid)}
.site-ft nav{display:flex;gap:18px;flex-wrap:wrap}
.site-ft nav a{color:var(--mid)}
.site-ft nav a:hover{color:var(--accent-dk)}
/* v74 (R5) — mobile : AUCUNE glisse horizontale de page (/actualites ET /cibles,
   _BASE_CSS est partagé via _head). Ceinture : overflow-x:clip — PAS hidden (règle
   v58 : hidden crée un conteneur de défilement et TUE le position:sticky des barres
   collées) ; clip borde sans créer de scroller → les stickies survivent. Les
   débordements réels (SVG larges, chips longues…) restent corrigés à la source. */
@media(max-width:760px){html,body{overflow-x:clip}}

.bcrumb{font-size:12.5px;color:#777;margin:18px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:'Inter',system-ui,sans-serif}
.bcrumb a{color:#777;text-decoration:none}
.bcrumb a:hover{color:#36a866;text-decoration:underline}
.bcrumb .sep{color:#E8E8E4}
.bcrumb .cur{color:#0A0A0A;font-weight:600}
.pph{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);
backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid #E8E8E4;
font-family:'Inter',system-ui,sans-serif}
.pph .in{max-width:1180px;margin:0 auto;padding:0 24px;min-height:60px;display:flex;
align-items:center;gap:18px;flex-wrap:nowrap}
.pph .brand{flex:0 0 auto}.pph .brand img{height:24px;display:block}
.pph nav{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;
gap:16px;font-size:14px;font-weight:500;flex-wrap:nowrap}
.pph nav>a,.pph .pph-auth a{color:#444;text-decoration:none;white-space:nowrap}
.pph nav>a:hover{color:#0a0a0a}
/* (retour CEO 20/07) — mobile : « Mon compte » s'affichait À LA VERTICALE (un mot,
   voire une lettre, par ligne). Cause : dans .pph nav (flex), .pph-sect et .pph-lang
   sont en flex:0 0 auto mais PAS .pph-auth → c'était le SEUL enfant compressible, il
   absorbait tout le débordement et rétrécissait à ~0, forçant le texte du bouton à
   passer à la ligne. Il devient incompressible : c'est le défileur horizontal du nav
   (v74) qui prend le relais, comme prévu. */
.pph .pph-auth{flex:0 0 auto;display:inline-flex;align-items:center;white-space:nowrap}
.pph .pph-auth button,.pph .pph-acct,.pph .pph-acct-btn{flex:0 0 auto;white-space:nowrap}
/* (retour CEO 19/07) — le style CTA vert doit AUSSI cibler les <button> : le menu
   « Mon compte » est un <button class="cta pph-acct-btn"> et n'héritait d'aucune
   couleur (le sélecteur ne visait que a.cta) → il apparaissait nu. */
.pph a.cta,.pph .pph-auth a.cta,.pph button.cta,.pph .pph-auth button.cta{color:#fff;background:#4AC67F;padding:8px 14px;
border-radius:9px;font-weight:600;border:none;cursor:pointer;font-family:inherit;line-height:1.2}
.pph a.cta:hover,.pph .pph-auth a.cta:hover,.pph button.cta:hover,.pph .pph-auth button.cta:hover{background:#36a866}
/* News + Analysis = bloc SECTION distinct (segmented pill vert) — autre partie du site */
.pph-sect{display:inline-flex;align-items:center;border:1px solid #cfe8da;background:#eef9f2;
border-radius:22px;overflow:hidden;white-space:nowrap;flex:0 0 auto}
.pph-sect a{padding:7px 15px;color:#2b7a52;font-weight:600;font-size:13px;text-decoration:none}
.pph-sect a+a{border-left:1px solid #cfe8da}
.pph-sect a.on,.pph-sect a:hover{background:#4AC67F;color:#fff}
/* Bouton de langue EN|FR — partage le choix (localStorage proplace_lang) avec le site React */
.pph-lang{display:inline-flex;align-items:center;border:1px solid #d9d9d3;border-radius:22px;
overflow:hidden;flex:0 0 auto}
.pph-lang button{font:inherit;font-size:12px;font-weight:600;padding:5px 9px;background:none;
border:none;color:#888;cursor:pointer;line-height:1;transition:.15s}
.pph-lang button:hover{color:#0a0a0a}
.pph-lang button.on{background:#0f1f33;color:#fff}
/* Dual-span i18n (textes avec interpolation, ex. nom de société) : le serveur rend les
   2 langues, le choix visiteur (data-pplang posé par le chrome JS) montre la bonne.
   Défaut sans JS = français. */
.i18n-en{display:none}
html[data-pplang=en] .i18n-en{display:inline}
html[data-pplang=en] .i18n-fr{display:none}
@media(max-width:760px){
 .pph .in{gap:9px;padding:0 13px}.pph nav{gap:9px;font-size:13px}
 .pph .pph-home{display:none}
 /* v74 (R5) — le SEUL débordeur réel mesuré à 390px est CETTE nav (Connexion +
    pastille News|Analysis + EN|FR ≈ 309px pour ~264px disponibles) : elle devient
    son PROPRE défileur horizontal (règle « wide content » : overflow-x:auto sur la
    pièce INTERNE — jamais sur un ancêtre d'une barre sticky). Alignée à gauche en
    mobile : un débordement côté start (flex-end) serait inatteignable au scroll. */
 .pph nav{min-width:0;justify-content:flex-start;overflow-x:auto;
 -webkit-overflow-scrolling:touch;scrollbar-width:none}
 .pph nav::-webkit-scrollbar{display:none}
 /* le resserrage mobile doit AUSSI viser les <button> : « Mon compte » en est un
    (même piège que la couleur du CTA, retour CEO 19/07). */
 .pph a.cta,.pph .pph-auth a.cta,.pph button.cta,.pph .pph-auth button.cta{padding:6px 10px;font-size:12px}
 .pph-sect a{padding:6px 10px;font-size:12px}
 .pph-lang button{padding:5px 7px;font-size:11px}
 /* v99 — 3 sections (News|Analysis|Research) : la pastille est ÉPINGLÉE EN TÊTE du
    défileur (order:-1) → les 3 boutons sont TOUJOURS visibles à gauche, c'est
    « Connexion » qui déborde/scrolle si l'écran est trop étroit (demande CEO). */
 .pph nav .pph-sect{order:-1;flex:0 0 auto}
 .pph nav .pph-auth{order:0}
 /* v75 (bug #7) — la pastille EN|FR est hors du <nav> (défileur) : collée à droite du
    header, toujours atteignable même quand le <nav> déborde/scrolle. */
 .pph-lang{margin-left:auto;flex:0 0 auto}
}
/* ≤430px : les 3 pastilles + Connexion tiennent ensemble (resserrage police/padding). */
@media(max-width:430px){
 .pph nav{gap:7px}
 .pph-sect a{padding:6px 9px;font-size:11.5px;letter-spacing:-.01em}
}

.tm-seg button{font-size:12.5px;font-weight:500;border:none;background:#fff;color:var(--sub);padding:6px 13px;cursor:pointer;transition:background .12s}
.tm-seg button:hover{background:var(--bg)}
.tm-seg button.on{background:var(--accent);color:#06281a;font-weight:700}

.tm-mine{flex-basis:100%;font-size:12.5px;color:var(--accent-dk);font-weight:700;margin:0}
/* Menus déroulants (Secteur/Pays/Stade + picker « 📅 Jour ») : CSS déplacé dans _DAYPICKER_CSS,

/* CTA « Recevez ce suivi » : apparaît quand ≥1 secteur est coché (piloté par le board JS). */

.thead{display:grid;grid-template-columns:minmax(0,1fr) 84px 102px 96px 48px 92px 116px;gap:12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid);padding:8px 0 6px;border-bottom:1px solid var(--line);margin-top:6px}

/* Filet de COULEUR par secteur (distinction visuelle au scroll) : barre verticale colorée à gauche

// ── Carte mentale interactive (markmap) ─────────────────────────────────────
// Mêmes bundles que les fiches publiées. ⚠️ markmap-lib s'appelle `index.iife.js` côté
// navigateur — `index.js` renvoie 404 et laisse un cadre vide (piège déjà rencontré sur
// les mémos). On ne remplace le PNG qu'une fois le SVG réellement construit.
var MM_LIBS=['https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js',
 'https://cdn.jsdelivr.net/npm/markmap-lib@0.18/dist/browser/index.iife.js',
 'https://cdn.jsdelivr.net/npm/markmap-view@0.18/dist/browser/index.js'];
var MM_READY=null;
function loadScript(src){
 return new Promise(function(res,rej){
  if(document.querySelector('script[src="'+src+'"]')){res();return;}
  var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;
  document.head.appendChild(s);});
}
function mmReady(){
 if(!MM_READY)MM_READY=MM_LIBS.reduce(function(p,src){
  return p.then(function(){return loadScript(src);});},Promise.resolve());
 return MM_READY;
}
function renderMindmap(md){
 mmReady().then(function(){
  var host=$('rs-mm');if(!host||!window.markmap)return;
  var T2=window.markmap.Transformer,M=window.markmap.Markmap;
  if(!T2||!M)return;                      // bundle incomplet → le PNG reste
  var r=new T2().transform(md);
  host.innerHTML='<svg class="rs-mm-svg"></svg>';
  M.create(host.querySelector('svg'),{initialExpandLevel:5,maxWidth:340,duration:200},r.root);
 }).catch(function(){/* CDN bloqué → le PNG reste affiché, jamais de cadre vide */});
}

 job('/research/publish',payload).then(function(res){
  if(!res||res.ok===false||res.status==='error'){
   msg('err',esc((res&&(res.error||res.message))||'Échec de la publication'));
   b.disabled=false;b.textContent=t.pub;return;}
  // Succès EXPLICITE, à l'endroit où l'œil est (sous le bouton), avec le lien cliquable :

  var url=res.url||'';

  var box=$('rs-prev');

 }).catch(function(e){

}

function wireFold(btnId,panelId,key){

}

/* Page /actualites/favoris/ : état vide + encart « créez votre thèse ». */
.fav-empty-box{margin:26px 0;padding:24px 20px;border:1px dashed var(--line);border-radius:12px;
background:var(--bg);text-align:center;color:var(--sub);font-size:14px;line-height:1.55}
.fav-empty-box a{color:var(--accent-dk);font-weight:700;text-decoration:none}
.fav-empty-box a:hover{text-decoration:underline}
.fav-tease{margin:22px 0 6px;padding:16px 18px;border:1px solid var(--accent);border-radius:12px;
background:var(--bg)}
.fav-tease-h{font-size:15px;font-weight:800;color:var(--ink);margin:0 0 6px}
.fav-tease-p{font-size:13.5px;color:var(--sub);line-height:1.5;margin:0 0 10px}
.fav-tease .tm-read{margin:0}
/* Composeur de thèse in-browser + évaluation groupée (Phase B). */
.fav-th-text{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
font-family:inherit;font-size:13.5px;line-height:1.5;color:var(--ink);resize:vertical;margin:0 0 8px}
.fav-th-text:focus{outline:none;border-color:var(--accent)}
.fav-btn{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--ink);
border:1px solid var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;transition:opacity .15s}
.fav-btn:hover{opacity:.85}
.fav-btn:disabled{opacity:.5;cursor:default}
.fav-th-edit{margin-left:10px;font-size:12.5px;font-weight:600;color:var(--accent-dk);background:none;
border:none;cursor:pointer;text-decoration:underline}
.fav-th-label{font-size:13px;color:var(--sub);font-style:italic;margin:0 0 8px}
.fav-th-hint{font-size:12px;color:#b91c1c;margin:6px 0 0}
/* Verdict d'un favori (plein largeur sous la ligne, comme .op-eval-panel). */
.fav-verdict{grid-column:1/-1;margin-top:2px}
.fav-verdict:empty{margin:0}
.fav-v{display:inline-block;font-size:12.5px;font-weight:800;border-radius:8px;padding:3px 10px;margin-top:6px}
.fav-v-yes{color:#047857;background:rgba(4,120,87,.10)}
.fav-v-no{color:#b91c1c;background:rgba(185,28,28,.08)}
.fav-v-err{color:var(--mid);background:var(--bg)}
.fav-v-load{color:var(--mid);font-size:12.5px;font-weight:600;margin-top:6px;display:inline-block}
.fav-vr{display:block;font-size:12.5px;color:var(--sub);line-height:1.45;margin-top:4px}
